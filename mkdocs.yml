site_name: "Civil Engineering LLM Wiki"
site_description: "Physics-informed ML, Computational Mechanics, Semantic Segmentation, LLMs, Remote Sensing & Generative 3D Knowledge Base"
site_author: "MorionNa"
repo_url: "https://github.com/MorionNa/civil-engineering-llm-wiki"
repo_name: "MorionNa/civil-engineering-llm-wiki"
docs_dir: "docs"

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.expand
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 暗色模式
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 亮色模式

