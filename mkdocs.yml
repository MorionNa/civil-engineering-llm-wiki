markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - roamlinks
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css

extra_javascript:
