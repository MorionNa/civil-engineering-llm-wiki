site_name: "Civil Engineering LLM Wiki"
site_description: "Physics-informed ML, Computational Mechanics, Semantic Segmentation, LLMs, Remote Sensing & Generative 3D Knowledge Base"
site_author: "MorionNa"
repo_url: "https://github.com/MorionNa/civil-engineering-llm-wiki"
repo_name: "MorionNa/civil-engineering-llm-wiki"
docs_dir: "docs"

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 暗色模式
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 亮色模式

# The Papers block is replaced at build time by scripts/mkdocs_hooks.py.
# Every Markdown page under docs/papers is therefore exposed in the sidebar.
nav:
  - 首页: index.md
  - Papers:
      - 论文索引: papers/index.md
  - Entities:
      - 实体索引: entities/index.md
      - NequIP: entities/nequip.md
      - Allegro: entities/allegro.md
      - SevenNet: entities/sevennet.md
  - Notes:
      - 笔记索引: notes/index.md
      - 物理 Token 与 Transolver: notes/articles/shenlan2026-physical-token-transolver.md
  - Comparisons: comparisons/index.md
  - SCHEMA: SCHEMA.md
  - 日志: log.md

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - roamlinks
  - search:
      lang: zh

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js
