site_name: "Civil Engineering LLM Wiki"
site_description: "Physics-informed ML & Computational Mechanics Knowledge Base"
site_author: "MorionNa"
repo_url: "https://github.com/MorionNa/civil-engineering-llm-wiki"
repo_name: "MorionNa/civil-engineering-llm-wiki"
docs_dir: "docs"

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.expand
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 暗色模式
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 亮色模式

nav:
  - 首页: index.md
  - Concepts:
      - concepts/index.md
      - AI4S 系列:
          - concepts/ai4s/ai4s-pinn-deepxde-tutorial.md
