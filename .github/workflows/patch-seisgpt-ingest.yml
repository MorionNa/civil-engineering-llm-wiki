name: Patch SeisGPT ingest metadata

on:
  push:
    branches:
      - ingest/seisgpt-2026-07-16

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ingest/seisgpt-2026-07-16
          fetch-depth: 0

      - name: Patch wiki metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Root index
          p = Path('index.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '> Last updated: 2026-07-16 | Total pages: 235 (Papers: 169, Notes: 5, Entities: 56, Comparisons: 3)',
              '> Last updated: 2026-07-16 | Total pages: 241 (Papers: 173, Notes: 5, Entities: 57, Comparisons: 4)'
          )
          paper_lines = '\n'.join([
              '- [[meng2026-seisgpt-analysis]] — Meng et al. (2026) SeisGPT：物理信息结构响应基础模型，270,694 建筑、205 万 NLTHA、约 40,000× 加速，Nature Communications',
              '- [[meng2026-seisgpt-method]] — SeisGPT 方法：SDR 低保真先验 + 质量刚度图编码 + Spectral Duhamel–Green Mixer',
              '- [[meng2026-seisgpt-results]] — SeisGPT 结果：未见建筑、真实微调、跨体系零样本、稀疏传感器、IDA 与振动台验证',
              '- [[meng2026-seisgpt-critical]] — SeisGPT 贡献+Negative（FE 标签依赖/楼层域/无失稳后倒塌/无不确定度）+研究机会',
              ''
          ])
          if '[[meng2026-seisgpt-analysis]]' not in s:
              s = s.replace('## Papers\n', '## Papers\n' + paper_lines, 1)
          entity_line = '- [[seisgpt]] — SeisGPT: 质量–刚度图 + SDG-Mixer 的多建筑结构响应基础模型\n'
          if '[[seisgpt]] — SeisGPT:' not in s:
              s = s.replace('### 物理信息机器学习\n', '### 物理信息机器学习\n' + entity_line, 1)
          comparison_line = '- [[seisgpt-vs-phylstm-cm-pinns]] — SeisGPT vs PhyLSTM vs CM-PINNs：大规模基础模型、物理序列模型与本构约束路线对比\n'
          if '[[seisgpt-vs-phylstm-cm-pinns]]' not in s:
              s = s.replace('## Comparisons\n', '## Comparisons\n' + comparison_line, 1)
          p.write_text(s, encoding='utf-8')

          # MkDocs navigation
          p = Path('mkdocs.yml')
          s = p.read_text(encoding='utf-8')
          paper_nav = '\n'.join([
              '      - Meng 2026 SeisGPT:',
              '          - papers/meng2026-seisgpt-analysis.md',
              '          - papers/meng2026-seisgpt-method.md',
              '          - papers/meng2026-seisgpt-results.md',
              '          - papers/meng2026-seisgpt-critical.md',
              ''
          ])
          if 'Meng 2026 SeisGPT:' not in s:
              s = s.replace('      - papers/index.md\n', '      - papers/index.md\n' + paper_nav, 1)
          if '          - entities/seisgpt.md' not in s:
              s = s.replace(
                  '      - 物理信息机器学习:\n',
                  '      - 物理信息机器学习:\n          - entities/seisgpt.md\n',
                  1
              )
          if '      - comparisons/seisgpt-vs-phylstm-cm-pinns.md' not in s:
              s = s.replace(
                  '      - comparisons/index.md\n',
                  '      - comparisons/index.md\n      - comparisons/seisgpt-vs-phylstm-cm-pinns.md\n',
                  1
              )
          p.write_text(s, encoding='utf-8')

          # Entities sub-index
          p = Path('entities/index.md')
          s = p.read_text(encoding='utf-8')
          if '[[seisgpt]]' not in s:
              marker = '## 算法 (Algorithms)\n'
              entry = '## 物理信息结构响应模型\n- [[seisgpt]] — SeisGPT: 质量–刚度图 + SDG-Mixer，多建筑预训练、LoRA 个性化与稀疏传感器重建\n\n'
              s = s.replace(marker, entry + marker, 1)
          p.write_text(s, encoding='utf-8')

          # Comparisons sub-index
          p = Path('comparisons/index.md')
          s = p.read_text(encoding='utf-8')
          if '[[seisgpt-vs-phylstm-cm-pinns]]' not in s:
              s = s.rstrip() + '\n\n- [[seisgpt-vs-phylstm-cm-pinns]] — 三类物理信息结构响应预测范式的机制、数据、泛化和选型对比\n'
          p.write_text(s, encoding='utf-8')

          # Append-only log
          p = Path('log.md')
          s = p.read_text(encoding='utf-8')
          entry = '\n' + '\n'.join([
              '## [2026-07-16] ingest | Meng et al. (2026) SeisGPT — 物理信息结构响应基础模型',
              '- Source: user-provided `s41467-026-75508-5_reference.pdf` (40 pages, SHA256 4206cb8eb4456caa6bafe2465c1dfee02e3211f230f089886ada1ed693a1c456)',
              '- Publication: Nature Communications, Article in Press, DOI 10.1038/s41467-026-75508-5, accepted 2026-07-03',
              '- Raw source retained outside GitHub; `raw/` remains excluded by repository policy',
              '- Created: papers/meng2026-seisgpt-{analysis,method,results,critical}.md',
              '- Created: entities/seisgpt.md',
              '- Created: comparisons/seisgpt-vs-phylstm-cm-pinns.md',
              '- Updated: index.md, entities/index.md, comparisons/index.md, mkdocs.yml',
              '- Domain: structural dynamics foundation model — SDR + mass–stiffness PIGNN + SDG-Mixer + LoRA + sparse-sensor assimilation',
              '- Key results: 270,694 buildings / 2,053,880 NLTHA / >10B time steps; 5,963–60,733× CPU-FEA speedup; zero-shot steel/masonry/isolation; shake-table and IDA validation',
              '- Wiki: 235→241 pages',
              ''
          ])
          if '## [2026-07-16] ingest | Meng et al. (2026) SeisGPT' not in s:
              s = s.rstrip() + entry
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate patched files
        shell: bash
        run: |
          grep -q 'meng2026-seisgpt-analysis' index.md
          grep -q 'Meng 2026 SeisGPT' mkdocs.yml
          grep -q 'entities/seisgpt.md' mkdocs.yml
          grep -q 'seisgpt-vs-phylstm-cm-pinns' comparisons/index.md
          grep -q '2026-07-16.*SeisGPT' log.md
          python - <<'PY'
          from pathlib import Path
          required = [
              'papers/meng2026-seisgpt-analysis.md',
              'papers/meng2026-seisgpt-method.md',
              'papers/meng2026-seisgpt-results.md',
              'papers/meng2026-seisgpt-critical.md',
              'entities/seisgpt.md',
              'comparisons/seisgpt-vs-phylstm-cm-pinns.md',
          ]
          missing = [x for x in required if not Path(x).exists()]
          if missing:
              raise SystemExit(f'Missing: {missing}')
          PY

      - name: Commit patched metadata
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.md mkdocs.yml log.md entities/index.md comparisons/index.md
          git commit -m '[auto-patch] update SeisGPT index, navigation, sub-indexes, and log'
          git push origin HEAD:ingest/seisgpt-2026-07-16
