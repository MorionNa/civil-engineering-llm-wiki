name: Finalize recent wiki ingests

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch indexes, navigation, schema, and log
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          PAPER_ENTRIES = """- [[zhang2026-legonet-analysis]] — Zhang et al. (2026) LegONet：边界适配谱基 + E/H/R 结构保持块 + Strang splitting，组合式复用 PDE 机制
          - [[zhang2026-legonet-method]] — LegONet 方法：baseplate、共享系数接口、trajectory-free operator matching 与可插拔推理
          - [[zhang2026-legonet-results]] — LegONet 结果：4 类 baseplate、10 个 PDE；湍流/刚性/3D/OOD 长时稳定性验证
          - [[zhang2026-legonet-critical]] — LegONet 贡献+Negative（baseplate 依赖/有限块库/splitting error）+结构动力学迁移
          - [[li2025-functional-scaling-laws-analysis]] — Li et al. (2025) FSL：用内禀时间与遗忘核统一描述学习率计划下完整 loss trajectory，NeurIPS 2025
          - [[li2025-functional-scaling-laws-method]] — FSL 方法：intrinsic-time SDE + Volterra 卷积 + signal-learning/noise-forgetting 分解
          - [[li2025-functional-scaling-laws-results]] — FSL 结果：WSD > 指数衰减 > 恒定学习率；0.1B–1B LLM 跨计划拟合与预测
          - [[li2025-functional-scaling-laws-critical]] — FSL 贡献+Negative（核代理/连续时间/渐近隐藏常数/规模限制）+PINN 调度迁移
          - [[li2026-sgno-analysis]] — Li et al. (2026) SGNO：非正谱生成元 + ETD-inspired correction，提高 PDE 长时自回归稳定性
          - [[li2025-node-onet-analysis]] — Li et al. (2025) NODE-ONet：物理编码 Neural ODE 学习 PDE 算子并增强时间外推
          - [[zeraatkar2026-pgt-analysis]] — Zeraatkar et al. (2026) PGT：Green 函数物理偏置进入 Transformer attention
          """

          ENTITY_ENTRIES = """- [[legonet]] — LegONet: 边界适配 baseplate 上可插拔的耗散/守恒/残差 PDE 算子块库
          - [[functional-scaling-law]] — Functional Scaling Law: 内禀时间 + 遗忘核描述完整训练 loss 轨迹
          - [[sgno]] — SGNO: 面向长时 PDE 自回归预测的谱生成神经算子
          - [[node-onet]] — NODE-ONet: 物理编码 Neural ODE 算子网络
          - [[pgt]] — PGT: Green 函数物理偏置引导 Transformer 信息传播
          """

          def add_after(text: str, marker: str, block: str, sentinel: str) -> str:
              if sentinel in text:
                  return text
              if marker not in text:
                  raise RuntimeError(f"marker not found: {marker!r}")
              return text.replace(marker, marker + block, 1)

          # Main index and website homepage.
          path = Path("index.md")
          text = path.read_text(encoding="utf-8")
          papers = len([p for p in Path("papers").glob("*.md") if p.name != "index.md"])
          notes = len([p for p in Path("notes").rglob("*.md") if p.name != "index.md"])
          entities = len([p for p in Path("entities").glob("*.md") if p.name != "index.md"])
          comparisons = len([p for p in Path("comparisons").glob("*.md") if p.name != "index.md"])
          total = papers + notes + entities + comparisons + 2  # SCHEMA + log
          header = f"> Last updated: 2026-07-28 | Total pages: {total} (Papers: {papers}, Notes: {notes}, Entities: {entities}, Comparisons: {comparisons})"
          text = re.sub(r"> Last updated: .*", header, text, count=1)
          text = add_after(text, "## Papers\n", PAPER_ENTRIES, "[[zhang2026-legonet-analysis]]")
          text = add_after(text, "### 物理信息机器学习\n", ENTITY_ENTRIES, "[[legonet]] — LegONet:")
          path.write_text(text, encoding="utf-8")
          Path("docs/index.md").write_text(text, encoding="utf-8")

          # Paper and entity sub-indexes.
          path = Path("papers/index.md")
          text = path.read_text(encoding="utf-8")
          if "[[zhang2026-legonet-analysis]]" not in text:
              text = text.rstrip() + "\n\n## 组合式神经算子与训练动力学\n\n" + PAPER_ENTRIES
          path.write_text(text, encoding="utf-8")

          path = Path("entities/index.md")
          text = path.read_text(encoding="utf-8")
          text = add_after(text, "## 算法 (Algorithms)\n", "\n" + ENTITY_ENTRIES, "[[legonet]] — LegONet:")
          path.write_text(text, encoding="utf-8")

          # MkDocs navigation.
          path = Path("mkdocs.yml")
          text = path.read_text(encoding="utf-8")
          paper_nav = """      - Zhang 2026 LegONet:
                    - papers/zhang2026-legonet-analysis.md
                    - papers/zhang2026-legonet-method.md
                    - papers/zhang2026-legonet-results.md
                    - papers/zhang2026-legonet-critical.md
                - Li 2025 Functional Scaling Laws:
                    - papers/li2025-functional-scaling-laws-analysis.md
                    - papers/li2025-functional-scaling-laws-method.md
                    - papers/li2025-functional-scaling-laws-results.md
                    - papers/li2025-functional-scaling-laws-critical.md
                - Li 2026 SGNO:
                    - papers/li2026-sgno-analysis.md
                - Li 2025 NODE-ONet:
                    - papers/li2025-node-onet-analysis.md
                - Zeraatkar 2026 PGT:
                    - papers/zeraatkar2026-pgt-analysis.md
          """
          # Correct indentation to match the existing two-level nav.
          paper_nav = paper_nav.replace("          - papers/", "          - papers/").replace("      - Zhang", "      - Zhang").replace("            - papers/", "          - papers/").replace("        - Li", "      - Li").replace("        - Zeraatkar", "      - Zeraatkar")
          # Use an explicit, known-good block after normalization.
          paper_nav = """      - Zhang 2026 LegONet:
                    - papers/zhang2026-legonet-analysis.md
                    - papers/zhang2026-legonet-method.md
                    - papers/zhang2026-legonet-results.md
                    - papers/zhang2026-legonet-critical.md
                - Li 2025 Functional Scaling Laws:
                    - papers/li2025-functional-scaling-laws-analysis.md
                    - papers/li2025-functional-scaling-laws-method.md
                    - papers/li2025-functional-scaling-laws-results.md
                    - papers/li2025-functional-scaling-laws-critical.md
                - Li 2026 SGNO:
                    - papers/li2026-sgno-analysis.md
                - Li 2025 NODE-ONet:
                    - papers/li2025-node-onet-analysis.md
                - Zeraatkar 2026 PGT:
                    - papers/zeraatkar2026-pgt-analysis.md
          """
          # Repair accidental 12-space child indentation in the literal above.
          paper_nav = "\n".join(
              ("          " + line.lstrip()) if line.lstrip().startswith("- papers/") else
              ("      " + line.lstrip()) if line.lstrip().startswith("- ") else line
              for line in paper_nav.splitlines()
          ) + "\n"
          if "Zhang 2026 LegONet:" not in text:
              text = text.replace("      - papers/index.md\n", "      - papers/index.md\n" + paper_nav, 1)
          entity_nav = """          - entities/legonet.md
                    - entities/functional-scaling-law.md
                    - entities/sgno.md
                    - entities/node-onet.md
                    - entities/pgt.md
          """
          entity_nav = "\n".join("          " + line.lstrip() for line in entity_nav.splitlines() if line.strip()) + "\n"
          if "          - entities/legonet.md" not in text:
              text = text.replace("      - 物理信息机器学习:\n", "      - 物理信息机器学习:\n" + entity_nav, 1)
          path.write_text(text, encoding="utf-8")

          # Add the tag vocabulary used by the recent pages.
          path = Path("SCHEMA.md")
          text = path.read_text(encoding="utf-8")
          taxonomy_line = "- **Neural operators & training dynamics:** neural-operator, operator-learning, neural-ode, physics-encoded-network, physics-aware-attention, fourier-operator, structure-preserving, operator-splitting, compositional-modeling, trajectory-free-training, spectral-method, boundary-condition, hamiltonian, dissipative-dynamics, long-horizon-rollout, autoregressive-rollout, exponential-time-differencing, scientific-machine-learning, pde, digital-twin, scaling-law, kernel-regression, stochastic-gradient-descent, learning-rate-schedule, intrinsic-time, compute-optimal-training\n"
          if "**Neural operators & training dynamics:**" not in text:
              text = text.replace("- **AI4S:**", taxonomy_line + "- **AI4S:**", 1)
          path.write_text(text, encoding="utf-8")

          # Normalize PGT tags to the repository taxonomy.
          path = Path("papers/zeraatkar2026-pgt-analysis.md")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"tags: \[[^\n]*\]", "tags: [physics-informed, pinn, transformer, physics-aware-attention, scientific-machine-learning]", text, count=1)
          path.write_text(text, encoding="utf-8")

          # Remove broken links introduced in the earlier FSL ingest.
          path = Path("entities/functional-scaling-law.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("- [[intrinsic-time]]\n- [[learning-rate-schedule]]", "- [[wang2021-pinn-ntk-failure-analysis]]\n- [[li2026-sgno-analysis]]")
          path.write_text(text, encoding="utf-8")

          path = Path("papers/li2025-functional-scaling-laws-analysis.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("- [[intrinsic-time]]\n", "")
          text = text.replace("- [[constant-vs-exponential-vs-wsd]]\n", "- [[wang2021-pinn-ntk-failure-analysis]]\n")
          path.write_text(text, encoding="utf-8")

          # Append ingest records (log is append-only).
          path = Path("log.md")
          text = path.read_text(encoding="utf-8")
          entries = []
          if "## [2026-07-28] ingest | Zhang et al. (2026) LegONet" not in text:
              entries.append("""## [2026-07-28] ingest | Zhang et al. (2026) LegONet — 可插拔结构保持 PDE 算子块
          - Source: user-provided `2603.07882v1.pdf` (40 pages, arXiv:2603.07882v1)
          - Created: papers/zhang2026-legonet-{analysis,method,results,critical}.md
          - Created: entities/legonet.md
          - Updated: index.md, docs/index.md, papers/index.md, entities/index.md, mkdocs.yml, SCHEMA.md
          - Domain: 组合式神经算子；boundary-adapted baseplate + E/H/R blocks + trajectory-free matching + Strang splitting
          - Key results: 4 baseplates / 10 PDEs；2D Navier–Stokes T=50 error <4%；3D Swift–Hohenberg ID/OOD error 10^-5–10^-4
          """)
          if "## [2026-07-28] ingest | Li et al. (2025) Functional Scaling Laws" not in text:
              entries.append("""## [2026-07-28] ingest | Li et al. (2025) Functional Scaling Laws — 完整损失轨迹与学习率计划
          - Source: user-provided NeurIPS 2025 PDF (arXiv:2509.19189)
          - Created: papers/li2025-functional-scaling-laws-{analysis,method,results,critical}.md
          - Created: entities/functional-scaling-law.md
          - Updated: index.md, docs/index.md, papers/index.md, entities/index.md, mkdocs.yml, SCHEMA.md
          - Domain: intrinsic-time SDE + forgetting-kernel convolution；WSD/exp/constant scaling efficiency
          """)
          if "## [2026-07-23] ingest | Li et al. (2026) SGNO" not in text:
              entries.append("""## [2026-07-23] ingest | Li et al. (2026) SGNO — 稳定长时 PDE 滚动预测
          - Created: papers/li2026-sgno-analysis.md, entities/sgno.md
          - Domain: spectral generator + ETD-inspired carry/correction
          """)
          if "## [2026-07-23] ingest | Li et al. (2025) NODE-ONet" not in text:
              entries.append("""## [2026-07-23] ingest | Li et al. (2025) NODE-ONet — 物理编码 Neural ODE 算子网络
          - Created: papers/li2025-node-onet-analysis.md, entities/node-onet.md
          - Domain: physics-encoded neural ODE + operator learning
          """)
          if "## [2026-07-22] ingest | Zeraatkar et al. (2026) PGT" not in text:
              entries.append("""## [2026-07-22] ingest | Zeraatkar et al. (2026) PGT — 物理感知 Transformer attention
          - Created: papers/zeraatkar2026-pgt-analysis.md, entities/pgt.md
          - Domain: Green-function physics bias + Transformer information propagation
          """)
          if entries:
              text = text.rstrip() + "\n\n" + "\n".join(e.strip() for e in entries) + "\n"
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate MkDocs build
        shell: bash
        run: |
          pip install mkdocs-material mkdocs-roamlinks-plugin
          PLUGIN=$(python -c "import mkdocs_roamlinks_plugin, os; print(os.path.join(os.path.dirname(mkdocs_roamlinks_plugin.__file__), 'plugin.py'))")
          sed -i 's/os.walk(self.base_docs_url)/os.walk(self.base_docs_url, followlinks=True)/g' "$PLUGIN"
          mkdocs build
          test -f site/index.html
          grep -q 'zhang2026-legonet-analysis' index.md
          grep -q 'Zhang 2026 LegONet' mkdocs.yml
          grep -q 'entities/legonet.md' mkdocs.yml

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/finalize-recent-ingests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.md docs/index.md papers/index.md entities/index.md mkdocs.yml SCHEMA.md log.md \
            papers/zeraatkar2026-pgt-analysis.md entities/functional-scaling-law.md \
            papers/li2025-functional-scaling-laws-analysis.md \
            .github/workflows/finalize-recent-ingests.yml
          git commit -m '[auto-patch] finalize LegONet and recent wiki ingests'
          git push origin HEAD:main
