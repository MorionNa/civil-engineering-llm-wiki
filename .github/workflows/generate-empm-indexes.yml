name: Finalize EMPM Indexes

on:
  push:
    branches:
      - ingest/empm-2601-17251-20260801

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ingest/empm-2601-17251-20260801
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate complete registries
        run: python scripts/generate_empm_indexes.py
      - name: Remove one-time helper files
        run: |
          rm -rf generated-empm-indexes
          rm -f scripts/generate_empm_indexes.py
          rm -f .github/workflows/generate-empm-indexes.yml
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/index.md sources/index.md entities/index.md log.md scripts/generate_empm_indexes.py .github/workflows/generate-empm-indexes.yml
          git commit -m "chore: register EMPM pages and remove one-time helper"
          git push origin HEAD:ingest/empm-2601-17251-20260801
