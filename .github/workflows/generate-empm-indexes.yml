name: Generate EMPM Index Artifact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_empm_indexes.py
      - uses: actions/upload-artifact@v4
        with:
          name: empm-generated-indexes
          path: generated-empm-indexes/
