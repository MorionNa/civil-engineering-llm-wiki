name: Validate Wiki

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wiki-repository-snapshot
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          pip install pyyaml mkdocs-material mkdocs-roamlinks-plugin

      - name: Patch roamlinks symlink support
        run: |
          PLUGIN=$(python -c "import mkdocs_roamlinks_plugin, os; print(os.path.join(os.path.dirname(mkdocs_roamlinks_plugin.__file__), 'plugin.py'))")
          sed -i 's/os.walk(self.base_docs_url)/os.walk(self.base_docs_url, followlinks=True)/g' "$PLUGIN"
          echo "Patched: $PLUGIN"

      - name: Run strict llm-wiki compliance lint
        run: python scripts/wiki_lint.py

      - name: Build MkDocs
        run: mkdocs build
