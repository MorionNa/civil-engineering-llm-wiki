name: Repair Skyfall-GS navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair MkDocs indentation and validate ingest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mkdocs.yml')
          text = path.read_text(encoding='utf-8')
          broken = '''      - Lee 2026 Skyfall-GS:
          - papers/lee2026-skyfall-gs-analysis.md
          - papers/lee2026-skyfall-gs-method.md
          - papers/lee2026-skyfall-gs-results.md
          - papers/lee2026-skyfall-gs-critical.md
          '''.replace('          - papers/', '- papers/')
          correct = '''      - Lee 2026 Skyfall-GS:
                    - papers/lee2026-skyfall-gs-analysis.md
                    - papers/lee2026-skyfall-gs-method.md
                    - papers/lee2026-skyfall-gs-results.md
                    - papers/lee2026-skyfall-gs-critical.md
          '''.replace('          ', '')
          # Build the exact desired block without dedent side effects.
          correct = '\n'.join([
              '      - Lee 2026 Skyfall-GS:',
              '          - papers/lee2026-skyfall-gs-analysis.md',
              '          - papers/lee2026-skyfall-gs-method.md',
              '          - papers/lee2026-skyfall-gs-results.md',
              '          - papers/lee2026-skyfall-gs-critical.md',
              '',
          ])
          broken = '\n'.join([
              '      - Lee 2026 Skyfall-GS:',
              '- papers/lee2026-skyfall-gs-analysis.md',
              '- papers/lee2026-skyfall-gs-method.md',
              '- papers/lee2026-skyfall-gs-results.md',
              '- papers/lee2026-skyfall-gs-critical.md',
              '',
          ])
          if broken in text:
              text = text.replace(broken, correct, 1)
          path.write_text(text, encoding='utf-8')

          import yaml
          yaml.safe_load(path.read_text(encoding='utf-8'))

          required = [
              Path('papers/lee2026-skyfall-gs-analysis.md'),
              Path('papers/lee2026-skyfall-gs-method.md'),
              Path('papers/lee2026-skyfall-gs-results.md'),
              Path('papers/lee2026-skyfall-gs-critical.md'),
              Path('entities/skyfall-gs.md'),
              Path('comparisons/skyfall-gs-vs-abot-earth.md'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'Missing: {missing}')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mkdocs.yml
          git commit -m '[auto-repair] fix Skyfall-GS MkDocs navigation indentation'
          git push origin HEAD:main
