name: Apply All-History Migration

on:
  push:
    branches:
      - repair/all-history-llm-wiki-20260731
    paths:
      - .github/workflows/apply-all-history-migration.yml

permissions:
  contents: write

concurrency:
  group: all-history-llm-wiki-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/all-history-llm-wiki-20260731
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct migration tools
        shell: bash
        run: |
          cat scripts/.migration_bootstrap/chunk-*.txt > /tmp/llm-wiki-migration.b64
          base64 --decode /tmp/llm-wiki-migration.b64 > /tmp/llm-wiki-migration.tar.gz
          tar -xzf /tmp/llm-wiki-migration.tar.gz
          rm -rf scripts/.migration_bootstrap
          rm -f test
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate.yml
          rm -f .github/workflows/apply-all-history-migration.yml

      - name: Apply repository-wide migration
        run: python scripts/migrate_all_history.py

      - name: Verify immutable raw sources
        run: git diff --exit-code -- raw

      - name: Install validation dependencies
        run: pip install pyyaml mkdocs-material mkdocs-roamlinks-plugin

      - name: Patch roamlinks symlink support
        shell: bash
        run: |
          PLUGIN=$(python -c "import mkdocs_roamlinks_plugin, os; print(os.path.join(os.path.dirname(mkdocs_roamlinks_plugin.__file__), 'plugin.py'))")
          sed -i 's/os.walk(self.base_docs_url)/os.walk(self.base_docs_url, followlinks=True)/g' "$PLUGIN"

      - name: Validate complete migrated wiki
        run: |
          python scripts/wiki_lint.py
          mkdocs build

      - name: Commit repository-wide migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair: migrate all historical pages to llm-wiki schema"
          git push origin HEAD:repair/all-history-llm-wiki-20260731
